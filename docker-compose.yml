version: '3.8'

services:
  web:
    build: .
    image: sydbal/site:latest
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  node_modules:
    name: sydbal_node_modules
